<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18a6c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="パグ旅すごろく">
<meta name="application-name" content="パグ旅すごろく">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="パグしか住んでいない沖縄本島を一周するすごろくゲーム">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<title>パグ旅すごろく ～沖縄本島一周バウ！～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dff3f8; --surface:#ffffff; --surface2:#eef8fb; --text:#1d2b36; --muted:#5b707d; --line:#cfe5ec;
  --sea:#18a6c9; --coral:#ff6b3d; --hibiscus:#e8336d; --sand:#f6e3b0; --gold:#f5b301; --leaf:#2f9e5a;
  --good:#16a34a; --bad:#e11d48;
  --shadow:0 8px 22px rgba(10,70,95,.16);
  background:var(--bg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1a24; --surface:#13293a; --surface2:#1a3446; --text:#eaf4f9; --muted:#9db5c3; --line:#28485b; --shadow:0 8px 22px rgba(0,0,0,.5); }
}
:root[data-theme="dark"]{ --bg:#0b1a24; --surface:#13293a; --surface2:#1a3446; --text:#eaf4f9; --muted:#9db5c3; --line:#28485b; --shadow:0 8px 22px rgba(0,0,0,.5); }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.ico{width:1.15em;height:1.15em;vertical-align:-.22em}
#app{position:relative;height:100%;max-width:640px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.btn{border:none;border-radius:16px;min-height:50px;padding:10px 16px;font-size:16px;font-weight:800;background:var(--surface2);color:var(--text);box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#ff8a4c,#ff6233);color:#fff;box-shadow:0 4px 0 #c94618}
.btn.sea{background:linear-gradient(180deg,#2bbfe0,#1496bd);color:#fff;box-shadow:0 4px 0 #0c6f8e}
.btn.gold{background:linear-gradient(180deg,#ffd34d,#f2a900);color:#3b2600;box-shadow:0 4px 0 #b97f00}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line);color:var(--muted)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:12px}
.btn small{display:block;font-size:12px;font-weight:700;opacity:.8}
.wide{width:100%}
.muted{color:var(--muted)}

/* ===== Title ===== */
#scrTitle{background:linear-gradient(180deg,#7fd8f0 0%,#bfeefa 45%,#fff3c9 62%,#2bb6d8 63%,#128fbd 100%)}
#titleArt{position:absolute;inset:0;width:100%;height:100%}
.titleBody{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 20px 22px;overflow-y:auto}
.logo{text-align:center;margin-top:4px}
.logo .tag{display:inline-block;background:#fff;color:#0e6f8f;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.logo h1{margin:10px 0 0;line-height:1.05;font-weight:800;color:#fff;letter-spacing:.02em;-webkit-text-stroke:0;text-shadow:0 3px 0 #ff6b3d,0 6px 0 #c2410c,0 10px 18px rgba(0,60,90,.35)}
.logo h1 .t1{display:block;white-space:nowrap;font-size:clamp(28px,9.4vw,58px)}
.logo h1 .t2{display:block;font-size:clamp(18px,5.4vw,26px);margin-top:10px;text-shadow:0 2px 0 #0e7fa6,0 4px 10px rgba(0,60,90,.3)}
.titlePug{width:150px;height:150px;margin:6px auto 0;animation:hop 2.4s ease-in-out infinite}
.menu{width:100%;max-width:360px;display:grid;gap:10px}
.menu .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu .btn{min-height:54px;font-size:17px}
@keyframes hop{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-14px)}86%{transform:translateY(0)}92%{transform:translateY(-6px)}}

/* ===== Generic page ===== */
.page{background:var(--bg)}
.pageHead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow);z-index:2}
.pageHead h2{margin:0;font-size:19px;flex:1}
.back{border:none;background:var(--surface2);border-radius:12px;width:44px;height:44px;font-size:20px}
.pageBody{flex:1;padding:14px 14px 24px}
.card{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;border-radius:11px;min-height:42px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.35}
.setRow{margin-bottom:14px}
.setRow label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}
.setRow .hint{font-size:12px;color:var(--muted);margin-top:4px}
.pCard{border-left:6px solid var(--pc);}
.pCard input{width:100%;font:inherit;font-size:16px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--text)}
.breeds{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px}
.breeds button{flex:0 0 auto;width:64px;border:2px solid transparent;background:var(--surface2);border-radius:14px;padding:4px 2px;font-size:10px;font-weight:700;color:var(--muted)}
.breeds button.on{border-color:var(--pc);color:var(--text);background:var(--surface)}
.breeds svg{display:block;margin:0 auto}
.howList{margin:0;padding-left:1.3em;line-height:1.9}
.legend{display:grid;gap:8px}
.legend div{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}
.legend i{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rankTable{width:100%;border-collapse:collapse;font-size:14px}
.rankTable td{padding:8px 4px;border-bottom:1px solid var(--line)}
.rankTable td:last-child{text-align:right;font-weight:800}

/* ===== Game ===== */
#scrGame{background:var(--bg)}
#hud{background:var(--surface);box-shadow:var(--shadow);z-index:3;padding:8px 10px 6px}
.hudTop{display:flex;gap:10px;align-items:flex-start}
.curPug{flex:0 0 58px;height:58px;border-radius:50%;background:var(--surface2);border:3px solid var(--pc);display:grid;place-items:center;overflow:hidden}
.curInfo{flex:1;min-width:0}
.curName{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden}
.curName .rk{margin-left:auto;background:var(--gold);color:#3b2600;border-radius:999px;padding:1px 9px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.cpuTag{font-size:10px;background:#64748b;color:#fff;border-radius:6px;padding:1px 5px}
.curLoc{font-size:12.5px;color:var(--muted);display:flex;gap:6px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.curLoc .prog{margin-left:auto;font-weight:800}
.curStats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;font-weight:800;margin-top:3px}
.mods{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mods span{font-size:11px;font-weight:800;background:#fff1c2;color:#7a4b00;border-radius:999px;padding:2px 8px}
.hudBtns{display:flex;flex-direction:column;gap:4px}
.iconBtn{border:none;background:var(--surface2);width:38px;height:34px;border-radius:10px;font-size:17px}
#hudChips{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;border:2px solid transparent;background:var(--surface2);border-radius:999px;padding:2px 9px 2px 3px;font-size:12px;font-weight:700}
.chip.on{border-color:var(--pc);background:var(--surface)}
.chip svg{border-radius:50%}
.chip span{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#boardWrap{flex:1;overflow:auto;position:relative;background:#22acd0;-webkit-overflow-scrolling:touch}
#board{display:block;width:100%;height:auto}
#board.zoom{width:175%}
#board .sq{cursor:pointer}
.piece.active .bob{animation:bob .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#walkTag{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#1d2b36;font-weight:800;padding:6px 16px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:15px;pointer-events:none;opacity:0;transition:opacity .2s;position:sticky;display:inline-block;margin-bottom:-36px;z-index:2}
#walkTag.show{opacity:1}
.walkHolder{position:sticky;top:0;height:0;z-index:2;display:flex;justify-content:center}
.walkHolder #walkTag{position:relative;left:auto;transform:none;margin:10px 0 0}
#ctrl{display:flex;gap:8px;padding:10px;background:var(--surface);box-shadow:0 -6px 18px rgba(10,70,95,.12);z-index:3}
#btnRoll{flex:1;min-height:64px;font-size:20px;border-radius:20px}
.sb{width:58px;min-height:64px;border:none;border-radius:16px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.sb span{font-size:10px;font-weight:800;color:var(--muted)}
.sb:disabled{opacity:.5}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:rgba(20,40,55,.94);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:14px;max-width:min(92vw,420px);text-align:center;opacity:0;pointer-events:none;transition:all .25s;z-index:80;line-height:1.5}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Modal ===== */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(6,32,48,.55)}
.modal.hidden{display:none}
#modalCard{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:26px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.2,1.45,.4,1)}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.ev{padding:18px 18px 16px;text-align:center;border-radius:26px}
.ev-good{background:linear-gradient(180deg,rgba(255,211,77,.28),transparent 150px)}
.ev-jackpot{background:linear-gradient(180deg,rgba(255,107,61,.3),rgba(255,211,77,.18) 120px,transparent 220px)}
.ev-bad{background:linear-gradient(180deg,rgba(100,116,139,.28),transparent 150px)}
.ev-neutral{background:linear-gradient(180deg,rgba(24,166,201,.2),transparent 150px)}
.kicker{display:inline-block;font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--surface);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.evPug{position:relative;width:112px;height:112px;margin:8px auto 0}
.evPug>svg{animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.evEmoji{position:absolute;right:-18px;top:-6px;font-size:40px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.evBig{font-size:64px;margin:8px 0 0}
.evWho{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--muted);margin-top:2px}
.evWho::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc)}
.ev h3{font-size:21px;margin:6px 0 4px;line-height:1.35}
.ev-bad h3{color:var(--bad)}
.ev-jackpot h3{color:#e2560f}
.ev p{margin:6px 0 8px;color:var(--muted);font-size:15px;line-height:1.65}
.evBtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.evBtns.list{max-height:46vh;overflow-y:auto;padding:2px}
.autoNote{font-size:11px;color:var(--muted);margin-top:8px}
.luckyBox{background:#e7f8e9;color:#14532d;border-radius:14px;padding:10px;font-size:14px;margin-top:6px}
.sheet{padding:18px}
.sheet h3{margin:0 0 4px;font-size:19px}
.itRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.itIco{font-size:26px;width:34px;text-align:center}
.itTx{flex:1;min-width:0}
.itTx b{display:block;font-size:15px}
.itTx small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.pInfo{border-left:6px solid var(--pc);padding:10px 12px;border-radius:14px;background:var(--surface2);margin-bottom:10px;text-align:left}
.pInfo .hd{display:flex;align-items:center;gap:8px;font-weight:800}
.pInfo .hd .rk{margin-left:auto}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--coral))}
.pInfo .ln{font-size:13px;line-height:1.7}
.roul{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 6px}
.rc{background:var(--surface2);border-radius:14px;padding:6px 2px;border:3px solid transparent;transition:transform .08s}
.rc b{display:block;font-size:13px;color:var(--muted)}
.rc span{display:block;font-size:22px}
.rc small{display:block;font-size:10px;font-weight:700;line-height:1.3}
.rc.hi{border-color:var(--coral);background:#fff1c2;transform:scale(1.08);color:#1d2b36}
.roulMsg{font-weight:800;font-size:17px;min-height:26px}
.goalWrap{text-align:center;padding:22px 16px 18px;border-radius:26px;background:linear-gradient(180deg,#7fd8f0,#c8f2fb 55%,#2bb6d8 56%,#138fbd);color:#fff;overflow:hidden;position:relative}
.goalWrap h3{font-size:clamp(24px,7vw,30px);margin:6px 0;text-shadow:0 3px 0 #ff6b3d,0 6px 12px rgba(0,0,0,.25)}
.goalWrap p{font-weight:800;font-size:17px;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.jumpPug{animation:jump .7s ease-in-out infinite;display:inline-block}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}

/* ===== Dice ===== */
#diceLayer{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(6,32,48,.35);pointer-events:none}
#diceLayer.hidden{display:none}
.diceBox{background:var(--surface);border-radius:28px;padding:22px 26px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;min-width:220px;animation:pop .25s cubic-bezier(.2,1.45,.4,1)}
#diceRow{display:flex;gap:12px;justify-content:center}
#diceRow.spin .die{animation:tumble .18s linear infinite}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(14deg) scale(.92)}100%{transform:rotate(0) scale(1)}}
.die{width:84px;height:84px;background:#fff;border-radius:18px;box-shadow:inset 0 -5px 0 #dbe4ea,0 4px 10px rgba(0,0,0,.2);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11px;gap:2px;border:2px solid #e7eef2}
.die i{border-radius:50%;margin:3px}
.die i.on{background:#1d2b36}
.die i.on.red{background:#e8336d;margin:0}
#diceRes{font-size:44px;font-weight:800;margin-top:10px;color:var(--coral);line-height:1}
#diceMod{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px;font-size:13px;font-weight:800}
#diceMod span{background:#fff1c2;color:#7a4b00;border-radius:999px;padding:2px 9px}
#diceMod b{width:100%;font-size:18px;margin-top:4px}

/* ===== Result ===== */
#scrResult{background:linear-gradient(180deg,#7fd8f0 0%,#c8f2fb 32%,#fff3c9 40%,#2bb6d8 41%,#0f86b3 100%)}
.resTop{text-align:center;padding:24px 16px 10px;color:#fff}
.resTop h2{margin:0;font-size:clamp(28px,8.6vw,40px);text-shadow:0 3px 0 #ff6b3d,0 6px 0 #c2410c,0 10px 16px rgba(0,60,90,.3)}
.resTop .win{font-size:clamp(19px,5.6vw,24px);font-weight:800;margin-top:6px;text-shadow:0 2px 0 #0e7fa6}
.resBody{padding:0 14px 20px}
.statWrap{overflow-x:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);margin-bottom:12px}
.statTable{border-collapse:collapse;font-size:13px;min-width:560px;width:100%}
.statTable th,.statTable td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.statTable th{font-size:11px;color:var(--muted);font-weight:800}
.statTable td.nm{text-align:left;font-weight:800}
.resBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ===== v3 additions ===== */
.cutin{position:fixed;top:calc(env(safe-area-inset-top,0px) + 118px);left:0;right:0;z-index:80;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateX(70%);transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .25s}
.cutin.show{opacity:1;transform:translateX(0)}
.ciBox{display:flex;align-items:center;gap:8px;max-width:min(92%,460px);background:linear-gradient(90deg,#1d2b36,#2b4152);color:#fff;border-radius:16px;padding:6px 14px 6px 6px;box-shadow:0 8px 22px rgba(0,0,0,.35);border:2px solid var(--gold)}
.ciPug{flex:0 0 44px;height:44px;border-radius:50%;background:#3a5367;display:grid;place-items:center}
.ciTx{font-size:13.5px;font-weight:800;line-height:1.45}
.ciTx b{display:block;font-size:11px;color:var(--gold)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{background:var(--surface);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow);border:3px solid #fff}
.ph .phPic{font-size:42px;height:64px;display:grid;place-items:center;background:linear-gradient(180deg,#bfeefa,#fff3c9);border-radius:12px;margin-bottom:6px}
.ph b{display:block;font-size:13px;line-height:1.35}
.ph small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.ph.lock{border:3px dashed var(--line);box-shadow:none}
.ph.lock .phPic{background:var(--surface2);color:var(--muted)}
.albBar{height:10px;background:var(--surface2);border-radius:9px;overflow:hidden;margin-top:6px}.albBar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold))}
.hlList{margin:0;padding-left:1.3em;line-height:1.75;font-size:14px}
.mBox{background:#fff1c2;color:#5a3a00;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.5;margin:6px 0}
.newSys div>span:first-child{font-size:20px;flex:0 0 26px;text-align:center}
@media (prefers-reduced-motion:reduce){.cutin{transition:none}}
#toast.show{pointer-events:auto;cursor:pointer}
.cutin.show .ciBox{pointer-events:auto;cursor:pointer}

.musicHint[hidden]{display:none}

#manualOv .mBar button.alt{background:#fff;color:#2b2140}
#manualOv iframe{flex:1;width:100%;border:0;background:#fff6e0;padding-bottom:env(safe-area-inset-bottom,0px)}
.piece{cursor:pointer}
.piece .actRing{animation:actPulse 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes actPulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.18);opacity:.55}}
.piece .actTag{animation:tagBob 1.1s ease-in-out infinite}
@keyframes tagBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.piece .pingRing{opacity:0;transform-box:fill-box;transform-origin:center}
.piece.ping .pingRing{animation:ping 1.5s ease-out 1}
@keyframes ping{0%{transform:scale(1);opacity:1}100%{transform:scale(3.4);opacity:0}}
#raceBar{position:relative;height:36px;margin:6px 2px 0}
#raceBar .rbTrack{position:absolute;left:16px;right:16px;top:15px;height:7px;border-radius:4px;background:repeating-linear-gradient(90deg,#f6e3b0 0 8px,#ffd98a 8px 16px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
#raceBar .rbEnd{position:absolute;top:8px;font-size:15px;line-height:1}
#raceBar .rbEnd.s{left:-2px}#raceBar .rbEnd.g{right:-2px}
#raceBar .rbLap{position:absolute;top:-4px;width:3px;height:15px;border-radius:2px;background:#e8a25a}
#raceBar .rbP{position:absolute;width:28px;height:28px;border-radius:50%;border:3px solid var(--pc);background:#fff;padding:0;display:grid;place-items:center;transform:translateX(-50%);transition:left .5s ease;box-shadow:0 2px 4px rgba(0,0,0,.18)}
#raceBar .rbP svg{width:22px;height:22px}
#raceBar .rbP i{position:absolute;right:-7px;bottom:-5px;font-style:normal;font-size:10px;font-weight:900;background:var(--pc);color:#fff;border:1.5px solid #fff;border-radius:9px;min-width:16px;line-height:13px;text-align:center}
#raceBar .rbP.on{z-index:3;box-shadow:0 0 0 3px #ffd34d,0 2px 6px rgba(0,0,0,.25)}
#raceBar .rbP.fin{opacity:.8}
.chip .num{font-style:normal;font-size:10px;font-weight:900;background:var(--pc);color:#fff;border-radius:9px;min-width:16px;line-height:15px;text-align:center}
.chip .loc{font-size:11px;line-height:1;margin-left:-1px}
</style>

<style>
/* Pop layout: chunky outlined sticker cards with offset shadows, rounded type,
   a candy palette, and a pug mascot. One column on phones. */
:root{
  --bg:#fff6e0; --card:#ffffff; --ink:#2b2140; --muted:#6b5f7d;
  --pink:#ff6fa5; --sky:#43c6f0; --mint:#5fd3a0; --sun:#ffd34d; --lilac:#b79cff; --orange:#ff9a3d;
  --pale-pink:#ffe1ee; --pale-sky:#dff5fd; --pale-mint:#dcf8ea; --pale-sun:#fff3c4; --pale-lilac:#ece4ff;
  --fawn:#e6bf86; --dot:rgba(43,33,64,.09);
  --shadow:#2b2140;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241d33; --card:#302745; --ink:#fbf4ff; --muted:#c7b9dd;
    --pink:#ff86b5; --sky:#6ad7f5; --mint:#7fe3b6; --sun:#ffe07a; --lilac:#c6b0ff; --orange:#ffae63;
    --pale-pink:#4a2a48; --pale-sky:#1f3d4d; --pale-mint:#1f4438; --pale-sun:#4a4023; --pale-lilac:#3a2f58;
    --fawn:#c79f62; --dot:rgba(255,255,255,.06); --shadow:#0c0816; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241d33; --card:#302745; --ink:#fbf4ff; --muted:#c7b9dd;
  --pink:#ff86b5; --sky:#6ad7f5; --mint:#7fe3b6; --sun:#ffe07a; --lilac:#c6b0ff; --orange:#ffae63;
  --pale-pink:#4a2a48; --pale-sky:#1f3d4d; --pale-mint:#1f4438; --pale-sun:#4a4023; --pale-lilac:#3a2f58;
  --fawn:#c79f62; --dot:rgba(255,255,255,.06); --shadow:#0c0816; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.8;padding-inline:16px;padding-block:0 56px;overflow-x:hidden;
}
h1,h2,h3{line-height:1.35;text-wrap:balance;margin:0;font-weight:900}
p{margin:0}
a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* Hero */
.hero{position:relative;text-align:center;padding:26px 8px 8px}
.hero .mascot{width:124px;height:auto;display:block;margin:0 auto;filter:drop-shadow(4px 5px 0 var(--shadow))}
.hero h1{font-size:30px;margin-top:8px;color:var(--ink);text-shadow:3px 3px 0 var(--sun)}
.hero h1 small{display:block;font-size:17px;color:var(--pink);text-shadow:none;margin-top:4px}
.hero p{margin:12px auto 0;max-width:30em;color:var(--muted);font-weight:700;font-size:15px}
.sparkle{position:absolute;font-size:22px;animation:bob 2.4s ease-in-out infinite}
.sparkle.a{left:8%;top:18px}.sparkle.b{right:8%;top:40px;animation-delay:.8s}.sparkle.c{right:20%;top:118px;animation-delay:1.4s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(12deg)}}

/* Chapter chips */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:14px -16px 0;padding:10px 16px;background:var(--bg);border-block:3px solid var(--shadow);overflow-x:auto;white-space:nowrap;display:flex;gap:9px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar a{display:inline-flex;align-items:center;min-height:42px;padding:6px 14px;border-radius:999px;border:3px solid var(--shadow);background:var(--card);color:var(--ink);text-decoration:none;font-weight:900;font-size:14px;box-shadow:3px 3px 0 var(--shadow)}
.bar a:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

.item .ic.pugic{background:var(--pale-sky);width:58px;height:58px}
.item .ic.pugic svg{width:48px;height:48px;display:block}
.item.breed:nth-child(2) .ic{background:var(--pale-pink)}
.item.breed:nth-child(4) .ic{background:var(--pale-sun)}
.item.breed:nth-child(6) .ic{background:var(--pale-lilac)}
svg.inl{vertical-align:-5px;display:inline-block}
/* Sticker cards */
section{
  position:relative;margin-top:26px;background:var(--card);border:3px solid var(--shadow);
  border-radius:24px;padding:20px 16px 18px;box-shadow:6px 6px 0 var(--shadow);scroll-margin-top:84px;
}
.chapter{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.badge{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;border:3px solid var(--shadow);font-weight:900;font-size:22px;box-shadow:3px 3px 0 var(--shadow);flex:none;color:var(--shadow)}
.chapter h2{font-size:23px;padding:2px 12px;border-radius:12px;border:3px solid var(--shadow);background:var(--sun);color:var(--shadow);box-shadow:3px 3px 0 var(--shadow);transform:rotate(-1.5deg)}
.c1 .badge{background:var(--sky)} .c1 h2{background:var(--pale-sky)}
.c2 .badge{background:var(--sun)} .c2 h2{background:var(--pale-sun)}
.c3 .badge{background:var(--pink)} .c3 h2{background:var(--pale-pink)}
.c4 .badge{background:var(--mint)} .c4 h2{background:var(--pale-mint)}
.c5 .badge{background:var(--lilac)} .c5 h2{background:var(--pale-lilac)}
.c6 .badge{background:var(--orange)} .c6 h2{background:var(--sun)}
.c7 .badge{background:var(--pink)} .c7 h2{background:var(--pale-pink)}
.c8 .badge{background:var(--sky)} .c8 h2{background:var(--pale-sky)}

.lead{font-weight:700;margin-bottom:12px}

/* Steps */
.step{display:grid;gap:12px;margin-top:16px;padding-top:16px;border-top:3px dotted var(--shadow)}
.step:first-of-type{border-top:0;margin-top:0;padding-top:0}
.step h3{font-size:18px}
.step > div > p{font-weight:700;color:var(--muted);font-size:15px;margin-top:2px}

/* Bubbles / tips */
.tip{position:relative;background:var(--pale-sun);border:3px solid var(--shadow);border-radius:18px;padding:11px 14px;font-weight:700;font-size:15px;box-shadow:4px 4px 0 var(--shadow)}
.tip b{color:var(--orange)}

/* Figures */
.fig{margin:0;background:var(--pale-sky);border:3px solid var(--shadow);border-radius:20px;padding:14px;display:grid;place-items:center;box-shadow:4px 4px 0 var(--shadow)}
.fig svg{width:100%;height:auto;display:block;max-width:360px}
.fig figcaption{font-size:13px;font-weight:700;color:var(--muted);margin-top:8px;text-align:center}
.phone{width:min(210px,70%);margin:0 auto;border:4px solid var(--shadow);border-radius:30px;padding:10px;background:var(--card);box-shadow:4px 4px 0 var(--shadow)}

/* Cards */
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.item{display:flex;gap:12px;align-items:center;padding:11px 12px;border:3px solid var(--shadow);border-radius:18px;background:var(--card);box-shadow:3px 3px 0 var(--shadow);min-width:0}
.item .ic{flex:none;width:48px;height:48px;display:grid;place-items:center;font-size:26px;border-radius:50%;border:3px solid var(--shadow);background:var(--pale-pink)}
.item b{display:block;font-size:16px}
.item span.t{font-size:15px;font-weight:700;color:var(--ink)}
.item:nth-child(4n+1) .ic{background:var(--pale-sky)}
.item:nth-child(4n+2) .ic{background:var(--pale-sun)}
.item:nth-child(4n+3) .ic{background:var(--pale-pink)}
.item:nth-child(4n) .ic{background:var(--pale-mint)}

/* Square colors */
.sq{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;border:3px solid var(--shadow);background:var(--card);box-shadow:3px 3px 0 var(--shadow);min-width:0}
.sq i{font-style:normal;flex:none;width:44px;height:44px;border-radius:14px;border:3px solid var(--shadow);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.sq b,.item b{display:block;font-weight:900;font-size:16.5px;color:var(--ink)}
.sq span.t{font-size:15px;font-weight:700}

/* Ordered flow */
ol.order{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:10px}
ol.order li{display:flex;align-items:center;gap:12px;font-weight:900;font-size:16px}
ol.order li b{flex:none;width:36px;height:36px;border-radius:50%;border:3px solid var(--shadow);display:inline-grid;place-items:center;background:var(--sun);color:var(--shadow);font-size:16px;box-shadow:2px 2px 0 var(--shadow)}
ol.order li:nth-child(2) b{background:var(--sky)}
ol.order li:nth-child(3) b{background:var(--mint)}
ol.order li:nth-child(4) b{background:var(--lilac)}
ol.order li:nth-child(5) b{background:var(--orange)}
ol.order li:nth-child(6) b{background:var(--pink)}

/* Extra / FAQ */
.faq{background:var(--pale-lilac);border:3px solid var(--shadow);border-radius:18px;padding:13px 14px;box-shadow:3px 3px 0 var(--shadow)}
.faq + .faq{margin-top:12px}
.faq h3{font-size:16px;margin-bottom:4px}
.faq p{font-size:15px;font-weight:700}
.end{text-align:center;margin-top:30px;font-weight:900;font-size:18px}
.end span{display:inline-block;animation:bob 2s ease-in-out infinite}

@media (min-width:640px){
  .grid2{grid-template-columns:1fr 1fr}
  .hero h1{font-size:36px}
  .hero .mascot{width:150px}
}
@media (prefers-reduced-motion:reduce){.sparkle,.end span{animation:none}}
</style>

<header class="hero">
  <span class="sparkle a" aria-hidden="true">✨</span>

function bgmPlay(name){
  BGM.want=name;

  const a=ac();if(!a)return;
  if(!BGM.master){BGM.master=a.createGain();BGM.master.connect(a.destination)}
  BGM.master.gain.setValueAtTime(BGMVOL[S.bgmVol]||.6,a.currentTime);
  if(BGM.cur&&BGM.cur.name===name){if(!BGM.timer)BGM.timer=setInterval(bgmTick,40);return}
  bgmFadeOut();
  const T=TRACKS[name];if(!T)return;
  const g=a.createGain();g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(1,a.currentTime+1.2);g.connect(BGM.master);

function bgmFadeOut(){
  const c=BGM.cur;if(!c||!actx)return;const t=actx.currentTime,g=c.g;
  try{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(Math.max(.0001,g.gain.value),t);g.gain.exponentialRampToValueAtTime(.0001,t+.8)}catch(e){}
  setTimeout(()=>{try{g.disconnect()}catch(e){}},1400);BGM.cur=null;
}

  if(!BGM.master||!actx||!S.bgm)return;const t=actx.currentTime,v=BGMVOL[S.bgmVol]||.6,m=BGM.master.gain;
  try{m.cancelScheduledValues(t);m.setValueAtTime(m.value,t);m.linearRampToValueAtTime(v*.25,t+.08);m.setValueAtTime(v*.25,t+sec);m.linearRampToValueAtTime(v,t+sec+.8)}catch(e){}

function bgmTick(){

  if(a.state!=='running'){if(userGest&&!document.hidden&&(!c.retry||performance.now()-c.retry>1500)){c.retry=performance.now();a.resume().catch(()=>{})}return}
  const sp=60/c.T.bpm/2;
  if(c.nextT<a.currentTime-.25)c.nextT=a.currentTime+.05;
  while(c.nextT<a.currentTime+.2){
    const T=c.T,st=c.step,t=c.nextT;
    try{

  }

  const wMouth=`<path d="M42 71 Q46 75 50 70.5 Q54 75 58 71" stroke="${mouthC}" stroke-width="2" fill="none" stroke-linecap="round"/>`;

    case 'joy':s+=E.map(e=>happyEye(e[0],e[1])).join('')+'<path d="M40 70 Q50 84 60 70Z" fill="#2a0f12"/>'+tongue(6,9,74)+blush+'<path d="M10 22 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z M88 14 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" fill="#ffc531"/>';break;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let BOARD=[],N=0;
function buildBoard(){
  const rng=mulberry32(20261005);BOARD=[];
  for(let i=0;i<SPOTS.length;i++){
    const a=SPOTS[i],b=SPOTS[(i+1)%SPOTS.length];
    BOARD.push({major:i,type:'major',x:a.x,y:a.y});
    const pts=[[a.x,a.y],...(VIAS[a.key]||[]),[b.x,b.y]];
    const seg=[];let L=0;
    for(let k=0;k<pts.length-1;k++){const d=Math.hypot(pts[k+1][0]-pts[k][0],pts[k+1][1]-pts[k][1]);seg.push(d);L+=d}
    const n=Math.max(1,Math.round(L/SPACING)-1);
    for(let j=1;j<=n;j++){
      let t=L*j/(n+1),k=0;
      while(k<seg.length-1&&t>seg[k]){t-=seg[k];k++}
      const r=seg[k]?t/seg[k]:0;
      BOARD.push({major:-1,type:null,x:pts[k][0]+(pts[k+1][0]-pts[k][0])*r,y:pts[k][1]+(pts[k+1][1]-pts[k][1])*r});
    }
  }
  N=BOARD.length;
  const tot=TYPE_WEIGHTS.reduce((s,w)=>s+w[1],0);
  BOARD.forEach(s=>{if(s.type)return;let r=rng()*tot;for(const [t,w] of TYPE_WEIGHTS){if((r-=w)<0){s.type=t;break}}if(!s.type)s.type='blue'});
  if(BOARD[1].type==='red'||BOARD[1].type==='typhoon')BOARD[1].type='blue';
  const godCount=BOARD.filter(s=>s.type==='god').length;
  if(godCount===0){for(let k=Math.floor(N*.62);k<N;k++)if(BOARD[k].major<0){BOARD[k].type='god';break}}
  let onsens=BOARD.filter(s=>s.type==='onsen').length;
  for(let k=5;k<N&&onsens<6;k+=13){if(BOARD[k].major<0&&BOARD[k].type==='blue'){BOARD[k].type='onsen';onsens++}}
}
let BRANCH=null,SPOT_POS=[];
function buildBranch(){
  SPOT_POS=SPOTS.map((_,i)=>BOARD.findIndex(b=>b.major===i));
  const F=SPOT_POS[SPOT_IDX.raipug],J=SPOT_POS[SPOT_IDX.nason],a=SPOTS[SPOT_IDX.raipug],b=SPOTS[SPOT_IDX.nason];
  const pts=[[a.x,a.y],[234,584],[214,522],[220,466],[b.x,b.y]];
  const seg=[];let L=0;for(let k=0;k<pts.length-1;k++){const d=Math.hypot(pts[k+1][0]-pts[k][0],pts[k+1][1]-pts[k][1]);seg.push(d);L+=d}
  const n=Math.max(3,Math.round(L/SPACING)-1),sq=[];
  for(let j=1;j<=n;j++){let t=L*j/(n+1),k=0;while(k<seg.length-1&&t>seg[k]){t-=seg[k];k++}const r=t/seg[k];sq.push({x:pts[k][0]+(pts[k+1][0]-pts[k][0])*r,y:pts[k][1]+(pts[k+1][1]-pts[k][1])*r})}
  const T=['onsen','red','god','walk','red','tada','onsen','red','nori'];
  BRANCH={from:F,to:J,pts,sq,types:sq.map((_,i)=>T[i%T.length]),posAt:k=>F+Math.max(1,Math.min(J-F-1,Math.round((k+1)*(J-F)/(sq.length+1))))};
}
function branchSvg(){
  if(!BRANCH)return '';const pl=BRANCH.pts.map(q=>q.join(',')).join(' ');
  let h=`<polyline points="${pl}" fill="none" stroke="#8a5a2b" stroke-width="6" stroke-opacity=".5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pl}" fill="none" stroke="#f6e3b0" stroke-width="1.8" stroke-dasharray="3 5"/>`;
  BRANCH.sq.forEach((c,i)=>{const t=SQ_TYPES[BRANCH.types[i]];h+=`<g class="sq" data-b="${i}"><circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="8.5" fill="${t.color}" stroke="#8a5a2b" stroke-width="2.2"/><text x="${c.x.toFixed(1)}" y="${(c.y+3.4).toFixed(1)}" font-size="9" font-weight="800" text-anchor="middle" fill="#fff">${t.icon}</text></g>`});

  return h;
}

function makeTicker(el,render,minMs,maxQ){

async function moveSteps(p,n,label,opt={}){
  if(!n||p.finished)return;
  const el=$(`#pc${p.id}`);
  let d=Math.sign(n),left=Math.abs(n),lapUp=false;p.lapLand=false;
  showWalk(label||(d>0?'てくてく……':'とぼとぼ……'));
  while(left>0){
    if(d>0&&p.br==null&&BRANCH&&p.pos===BRANCH.from&&!opt.noFork){hideWalk();await chooseRoute(p);showWalk(label||'てくてく……')}
    let nx;
    if(d>0){
      if(p.br!=null)nx=p.br+1<BRANCH.sq.length?{pos:BRANCH.posAt(p.br+1),br:p.br+1}:{pos:BRANCH.to,br:null};
      else if(p.takeBranch&&BRANCH&&p.pos===BRANCH.from){p.takeBranch=false;nx={pos:BRANCH.posAt(0),br:0}}
      else nx={pos:p.pos+1,br:null};
      if(nx.pos>N){d=-1;continue}
    }else{
      if(p.br!=null)nx=p.br>0?{pos:BRANCH.posAt(p.br-1),br:p.br-1}:{pos:BRANCH.from,br:null};
      else nx={pos:p.pos-1,br:null};
      if(nx.pos<0)break;
    }
    const to=nx.br!=null?BRANCH.sq[nx.br]:coordOf(nx.pos);
    if(el)await tween(el,pieceXY(p),to,D(190));
    if(d>0){p.stats.dist++;if(nx.br==null&&nx.pos<N&&BOARD[nx.pos].major>0){p.stats.spots++;addStamp(p,SPOTS[BOARD[nx.pos].major].key)}}
    p.pos=nx.pos;p.br=nx.br;left--;SFX.step();focusXY(to,true,true);
    if(p.pos===N&&!isFinalLap(p)){p.pos=0;p.lap=(p.lap||0)+1;lapUp=true;p.lapLand=left===0}
    if(p.pos===N&&!RULE('exactGoal'))break;
  }
  hideWalk();renderPieces();renderHud();
  if(lapUp)await lapBonus(p);
  if(p.pos===N)await reachGoal(p);
}

async function warpTo(p,target){
  const wrapping=target>=N&&!isFinalLap(p);
  if(!wrapping&&target>N)target=RULE('exactGoal')?Math.max(0,N-(target-N)):N;
  target=Math.max(0,target);
  if(p.br!=null&&BRANCH&&target<BRANCH.to&&target!==p.pos){
    const k=p.br+(target-p.pos),el0=$(`#pc${p.id}`);
    if(k>=0&&k<BRANCH.sq.length){
      SFX.warp();showWalk('ひゅ～ん！');focusXY(BRANCH.sq[k],true);
      if(el0)await tween(el0,pieceXY(p),BRANCH.sq[k],D(750),46);
      if(k>p.br)p.stats.dist+=k-p.br;p.br=k;p.pos=BRANCH.posAt(k);hideWalk();renderPieces();renderHud();return;
    }
    target=k<0?Math.max(0,BRANCH.from+1+k):BRANCH.to+(k-BRANCH.sq.length);
  }
  if(target===p.pos&&p.br==null)return;
  if(target-p.pos>=10)commentate(`ビューン！${p.name}が${target-p.pos}マスの大ジャンプ！`,Math.min(9,Math.floor((target-p.pos)/2)));
  const el=$(`#pc${p.id}`);SFX.warp();showWalk('ひゅ～ん！');
  focusPos(target,true);
  if(el)await tween(el,pieceXY(p),coordOf(wrapping?N:target),D(750),46);
  if(target>p.pos){p.stats.dist+=target-p.pos;for(let i=p.pos+1;i<=target&&i<N;i++)if(BOARD[i].major>0)p.stats.spots++}
  p.br=null;p.takeBranch=false;
  if(wrapping){p.lap=(p.lap||0)+1;p.pos=Math.min(N-1,target-N);p.lapLand=p.pos===0;hideWalk();renderPieces();renderHud();await lapBonus(p);return}
  p.pos=target;hideWalk();renderPieces();renderHud();
  if(p.pos>=N)await reachGoal(p);
}

function processMeta(){
  const hum=state.players.filter(p=>!p.isCPU);if(!hum.length)return '';
  const rows=memRows(),mvp=rows[0].p,w=[...state.players].sort((a,b)=>a.finishOrder-b.finishOrder)[0];
  const L=life();L.games++;if(!w.isCPU)L.wins++;if(!mvp.isCPU)L.mvp++;
  hum.forEach(p=>{L.onsen+=p.stats.onsen||0;L.walks+=p.stats.walks||0;L.nori+=p.stats.noriTotal||0;L.stamps+=Object.keys(p.stamps||{}).length;L.owners+=p.stats.shops||0;L.missions+=p.missionsDone||0;if(p.firstClass)L.first++});
  let medals=0;hum.forEach(p=>{medals+=Math.floor(rows.find(r=>r.p===p).t/10)});
  if(!w.isCPU)medals+=5;if(!mvp.isCPU)medals+=5;
  let dl='';
  if(state.daily){const D=store.get(KEY_DAILY)||{},k=state.daily,sc=rows.find(r=>r.p===hum[0]).t,rec=D[k]||{best:0,plays:0},first=rec.plays===0;rec.plays++;const nb=sc>rec.best;if(nb){rec.best=sc;rec.name=hum[0].name}D[k]=rec;store.set(KEY_DAILY,D);L.daily++;L.dailyDays=L.dailyDays||[];if(!L.dailyDays.includes(k))L.dailyDays.push(k);if(first)medals+=10;
    dl=`<div class="dRow"><span>📅 デイリー（${k.slice(5).replace('-','/')}）</span><b>${sc}pt${nb?' 🎉自己ベスト':`（ベスト${rec.best}）`}</b></div>${first?'<div class="dRow"><span>デイリー初回ボーナス</span><b>+10</b></div>':''}`}
  store.set(KEY_LIFE,L);
  const M=meta();M.medals+=medals;store.set(KEY_META,M);
  const G={hum,w,mvp,players:state.players,cpus:state.players.filter(p=>p.isCPU).length,level:RULE('cpuLevel')};
  const newA=ACH.filter(a=>{try{return !achGot()[a.id]&&a.c(L,G)}catch(e){return false}}).filter(a=>grantAch(a));
  const M2=meta();
  return `<div class="card" style="margin:12px 0"><h3>🎖️ やり込み</h3><div class="dRow"><span>思い出メダル</span><b>+${medals+newA.length*5}（所持 ${M2.medals}）</b></div>${dl}
  ${newA.length?`<div style="margin-top:8px;font-weight:800">🏅 新しい実績</div>${newA.map(a=>`<div class="achRow"><div class="ai">${a.i}</div><div class="at"><b>${a.n}</b><br>称号「${a.t}」が使えるようになったバウ</div></div>`).join('')}`:''}</div>`;
}

async function onsenBath(p,kicker){
  const b=2*(state.weather==='rain'?2:1)+(p.breed==='white'?1:0);
  p.stats.onsen++;p.nextBonus+=b;SFX.onsen();photo(p,'onsen');
  await say(p,{kicker:kicker||'♨ 温泉',emoji:'♨️',title:'いい湯だバウ～～',text:`ふぅ～～～。体の芯からほっこり。次のターン出目+${b}！${state.weather==='rain'?'（雨の日の温泉は格別）':''}${p.breed==='white'?'（温泉マスター）':''}`,face:'onsen',delay:1700});
}
async function doWalk(p){
  p.stats.walks++;
  const fwd=p.breed==='apricot'||rand()<.75,n=fwd?rr(1,6):rr(1,3);
  await say(p,{kicker:'🐾 セルフ散歩',emoji:'🐾',title:'パグが勝手に散歩に行った！',text:'飼い主に黙ってお出かけバウ。どこまで行ったのかわからない！',face:'proud'});
  await moveSteps(p,fwd?n:-n,'とことこ……（セルフ散歩中）');
  if(p.finished)return;
  if(fwd)p.stats.longestWalk=Math.max(p.stats.longestWalk,n);
  if(fwd&&n===6){photo(p,'walk6');commentate(`${p.name}、セルフ散歩で6マスの大冒険！`,3)}
  await say(p,{emoji:fwd?'🐾':'❓',title:fwd?`${n}マス先で発見されたバウ！`:`逆方向に${n}マス歩いてた…`,text:fwd?'得意げな顔でしっぽフリフリ。':'迷子パグになっちゃったバウ。',face:fwd?'proud':'trouble',tone:fwd?'good':'bad'});
  if(rand()<.38){
    if(rand()<.5)await onsenBath(p,'🐾 散歩中に温泉を発見！');
    else{const k=rr(1,2);addNori(p,k);SFX.good();await say(p,{kicker:'🐾 セルフ散歩',emoji:NORI,title:'味付けのりを拾った！',text:`のりGETバウ！ 味付けのり+${k}枚`,face:'joy'})}
  }
}
async function pagkiFly(p,n,depth){
  await moveOrWarp(p,n);
  if(!p.finished&&depth<1)await landing(p,depth+1);
}
async function moveOrWarp(p,n){await warpTo(p,Math.max(0,p.pos+n))}
async function godBonus(p,title,kicker,depth){
  SFX.jackpot();const r=rint(6);photo(p,'god');commentate(`${p.name}にパグ神が降臨！`,8);
  const base={kicker,emoji:'✨',title,face:'joy',tone:'jackpot'};
  if(r===0){await say(p,{...base,text:'パグ神の追い風！10マス進むバウ！'});await moveSteps(p,10,'びゅーん！')}
  else if(r===1){giveItem(p,'ticket');await say(p,{...base,text:'タダ旅行券をさずかった！'})}
  else if(r===2){addBau(p,3000);await say(p,{...base,text:'3000バウをさずかった！'})}
  else if(r===3){addNori(p,10);await say(p,{...base,text:'味付けのり10枚！のり天国バウ！'})}
  else if(r===4&&depth<1){await say(p,{...base,text:'もう一度サイコロを振れるバウ！'});await rollAndMove(p,depth+1)}
  else{
    const i=nextOfType(fromPos(p),'pagki',40);
    if(i<0||r===4){addBau(p,2000);await say(p,{...base,text:'2000バウをさずかった！'})}
    else{await say(p,{...base,text:'近くのぱぐーきマスへ案内してくれるバウ！'});await warpTo(p,i);if(!p.finished)await pagkiEvent(p,1)}
  }
}

/* ---------- turn flow ---------- */
async function rollAndMove(p,depth){
  const nd=1+(p.extraDie||0)+(p.doubleRoll&&depth===0?1:0);
  if(depth===0)p.doubleRoll=false;
  p.extraDie=0;
  const vals=[];for(let i=0;i<nd;i++)vals.push(i===0&&p.omamoriActive?rr(4,6):rr(1,6));
  p.omamoriActive=false;
  const mods=[];
  if(depth===0){
    if(p.nextBonus)mods.push(['ボーナス',p.nextBonus]);
    p.buffs.forEach(b=>mods.push([b.label,b.add]));
    if(p.lucky&&rand()<.15)mods.push(['🍀ラッキー',1]);
    if(state.weather==='rainbow')mods.push(['🌈虹',1]);
    if(state.spurt){const act=state.players.filter(x=>!x.finished);if(prog(p)<Math.max(...act.map(prog)))mods.push(['🔥追い上げ風',1])}
    p.nextBonus=0;p.buffs.forEach(b=>b.turns--);p.buffs=p.buffs.filter(b=>b.turns>0);
    p.stats.turns++;
  }
  const total=vals.reduce((a,b)=>a+b,0)+mods.reduce((a,m)=>a+m[1],0);
  renderHud();
  await showDice(vals,mods,total);
  await moveSteps(p,total);
  if(p.finished||state.over)return;
  await landing(p,depth);
  if(p.finished||state.over)return;
  if(depth===0)await encounter(p);
  if(p.finished||state.over)return;
  if(depth===0&&RULE('randomEvents')&&rand()<(p.lucky?.17:.12)*(state.spurt?1.8:1))await randomEvent(p);
  if(p.finished||state.over)return;
  await checkMilestones(p);
}
async function useTicket(p){

  if(RULE('ticketMode')==='random'){let t=p.pos+rr(4,14);if(isFinalLap(p))t=Math.min(N-1,t);await warpTo(p,t);if(!p.finished)await landing(p,1)}

async function useRail(p){
  let i=fromPos(p)+1;while(i<N&&BOARD[i].major<0)i++;

  await warpTo(p,i);

}
async function usePagki(p){

  await say(p,{kicker:'✈️ ぱぐーきチケット',emoji:'✈️',title:'ぱぐーきに搭乗！',text:`${n}マス先へひとっ飛びバウ！`,face:'joy',delay:1100});

async function cpuTurn(p){
  await wait(D(450));
  const lv=RULE('cpuLevel'),toGoal=remainOf(p);
  if(p.items.ticket>0&&ticketUsable(p)){
    const use=lv==='hard'?(toGoal<=20||rand()<.3):lv==='normal'?(toGoal<=14?rand()<.7:rand()<.12):rand()<.1;
    if(use){p.items.ticket--;p.stats.freeTrips++;p.stats.turns++;await useTicket(p);await checkMilestones(p);return}
  }
  if(p.items.pagki>0&&(lv==='hard'||rand()<(lv==='normal'?.4:.2))){p.items.pagki--;p.stats.turns++;await usePagki(p);await checkMilestones(p);return}
  if(p.items.rail>0){let i=fromPos(p)+1;while(i<N&&BOARD[i].major<0)i++;const gap=i-p.pos;if(gap>=(lv==='hard'?7:9)&&rand()<(lv==='easy'?.3:.8)){p.items.rail--;p.stats.turns++;await useRail(p);await checkMilestones(p);return}}
  if(p.items.onsenken>0&&rand()<(lv==='easy'?.1:.3)){p.items.onsenken--;p.stats.turns++;await useOnsenken(p);await checkMilestones(p);return}
  if(p.items.dice>0&&(lv==='hard'?toGoal>4:rand()<(lv==='normal'?.5:.25))){p.items.dice--;p.extraDie=(p.extraDie||0)+1;await say(p,{emoji:'🎲',title:`${esc(p.name)}はサイコロ+1を使った！`,face:'proud',delay:900})}
  if(p.items.omamori>0&&rand()<(lv==='easy'?.2:.55)){p.items.omamori--;p.omamoriActive=true;await say(p,{emoji:'🧿',title:`${esc(p.name)}はお守りを使った！`,text:'次の出目は4～6！',face:'proud',delay:900})}
  await rollAndMove(p,0);
}
async function startTurn(){
  if(!state||state.over)return;
  const p=cur();
  if(p.finished)return endTurn();
  phase='busy';p.face='normal';p.myTurns=(p.myTurns||0)+1;
  if(TOASTS)TOASTS.q.length=0;
  saveGame();renderPieces();renderHud();setControls();focusPos(pieceXY(p),true);
  await wait(D(300));
  p.prevRank=ranks()[p.id];
  if(state.wNews){state.wNews=false;const W=WEATHER[state.weather],FW=WEATHER[state.forecast];commentate(`${state.round}日目の天気は${W.i}${W.n}！${W.d}。明日は${FW.i}${FW.n}の予報バウ。`)}
  if(state.weather==='rainbow')photo(p,'rainbow');
  await checkSpurt();
  bgmUpdate();
  if(!state||state.over)return;
  if(p.skip>0){p.skip--;await say(p,{emoji:'💤',title:`${esc(p.name)}はお休み中…`,text:'今回は1回休みバウ。zzz…',face:'sleep',tone:'neutral',delay:1200});return endTurn()}
  if(state.weather==='typhoon'&&rand()<.25){await typhoonGust(p);if(!state||state.over)return;if(p.finished)return endTurn()}
  if(RULE('underdog'))await maybeUnderdog(p);
  if(!state||state.over)return;
  if(p.finished)return endTurn();
  if(p.isCPU){await cpuTurn(p);endTurn()}
  else{phase='await';setControls();renderHud();toast(`${esc(p.name)}のばん！サイコロを振ってね`)}
}
function endTurn(){
  if(!state||state.over)return;
  phase='busy';
  try{afterTurnCommentary()}catch(e){}
  const n=state.players.length;let j=state.turn,found=false;
  for(let k=1;k<=n;k++){j=(state.turn+k)%n;if(!state.players[j].finished){found=true;break}}
  if(!found){endGame();return}
  if(j<=state.turn){state.round++;advanceWeather()}
  state.turn=j;
  setTimeout(startTurn,D(250));
}
async function reachGoal(p){
  if(p.finished)return;
  {const canB=p.bau>=1000,canN=p.items.nori>=3;
   if(canB||canN){const btns=[];if(canN)btns.push({label:'✨ ファーストクラス（のり3枚）',value:2,cls:'gold'});if(canB)btns.push({label:'✨ ファーストクラス（1000バウ）',value:1,cls:'gold'});btns.push({label:'💺 エコノミーでOK',value:0,cls:'ghost'});

  showModalHtml(`<div class="goalWrap"><div style="font-size:15px;font-weight:800">🏁 那覇空港</div><h3>沖縄一周達成バウ～～！！</h3><div>${pugs}</div><p>${esc(p.name)}（${BREEDS[p.breed].name}）${p.finishOrder===1?'が一番乗り！':`が${p.finishOrder}位でゴール！`}</p><button class="btn gold wide" id="goalOk">やったー！</button></div>`);

  const rest=state.players.filter(x=>!x.finished);

function endGame(){

function updateRanking(){
  const R=store.get(KEY_RANK)||{games:0,wins:{}};R.wins=R.wins||{};R.games=(R.games||0)+1;

  R.mvp=R.mvp||{};{const mv=memRows()[0].p;const key=`${mv.name}（${BREEDS[mv.breed].name}）`;R.mvp[key]=(R.mvp[key]||0)+1}

function enterGame(){
  show('scrGame');renderBoard();renderPieces();renderHud();setControls();
  requestAnimationFrame(()=>focusPos(pieceXY(cur()),false));
}
function startNewGame(humans,cpus,opt={}){
  RNGS=opt.seed!=null?opt.seed|0:(Math.random()*4294967296)|0;
  const players=humans.map((h,i)=>newPlayer(i,h.name,h.breed==='random'?pick(BREED_KEYS):h.breed,false));
  const used=new Set(players.map(p=>p.breed)),CPU_NAMES=['ゴマ','モチ','ちんすこう'];
  for(let k=0;k<cpus;k++){const avail=BREED_KEYS.filter(b=>!used.has(b)),br=avail.length?pick(avail):pick(BREED_KEYS);used.add(br);const c=newPlayer(players.length,`CPU${CPU_NAMES[k]}`,br,true);if(rand()<.35)c.costume=pick(COSTUME_KEYS);players.push(c)}
  humans.forEach((h,i)=>{players[i].costume=h.costume&&COSTUMES[h.costume]?h.costume:null;players[i].title=h.title||''});
  players.forEach(p=>{addBau(p,1000);giveItem(p,'dice',1);p.items.nori+=1;p.stats.noriTotal+=1;p.stats.items+=1});
  const lucky=pick(players);lucky.lucky=true;
  state={v:3,N,players,turn:0,round:1,finishCount:0,over:false,owners:{},weather:rollWeather(),forecast:rollWeather(),wNews:true,spurt:false,hl:[],lastLeader:null,daily:opt.daily||null,rules:opt.rules||null,laps:Math.max(1,Math.min(3,opt.laps||S.laps||1))};
  players.forEach(dealMission);
  phase='busy';enterGame();
  (async()=>{
    SFX.jackpot();
    await say(players[0],{kicker:'✈️ 那覇空港',emoji:'🛫',title:'ぱぐーきに乗って沖縄本島一周の旅へ出発バウ！',text:'全員に 1000バウ・サイコロ+1・味付けのり1枚 をプレゼント！',html:`<div class="luckyBox">🍀 今回のラッキーパグは <b>${esc(lucky.name)}</b>！ 小さなボーナスを受けやすいバウ。</div>`,face:'joy',auto:false,buttons:[{label:'出発！',value:'ok'}]});
    startTurn();
  })();
}
function continueGame(){
  const s=store.get(KEY_SAVE);
  if(!s||s.v!==3||s.N!==N||!Array.isArray(s.players)){toast('続きのデータが見つかりませんでした');renderTitle();return}
  state=s;state.over=false;RNGS=s.rs!=null?s.rs:(Math.random()*4294967296)|0;phase='busy';enterGame();
  toast(`ターン${state.round}から再開バウ！`);
  setTimeout(startTurn,400);
}

async function useItem(k){
  const p=cur();if(phase!=='await'||p.isCPU||p.items[k]<=0)return;
  if(k==='ticket'&&!ticketUsable(p)){toast('🎫 ゴールの那覇空港は目の前！タダ旅行券はここでは使えないバウ');return}
  SFX.click();p.usedItems=(p.usedItems||0)+1;
  if(k==='dice'){p.items.dice--;p.extraDie=(p.extraDie||0)+1;toast('🎲 このターンはサイコロが1個増える！');renderHud();return}
  if(k==='omamori'){p.items.omamori--;p.omamoriActive=true;toast('🧿 お守りパワー！次の出目は4～6');renderHud();return}
  phase='busy';setControls();p.items[k]--;p.stats.turns++;
  if(p.extraDie){p.items.dice+=p.extraDie;p.extraDie=0;toast('🎲 サイコロ+1は使わずに戻したバウ')}
  if(p.omamoriActive){p.items.omamori++;p.omamoriActive=false}
  if(k==='ticket'){p.stats.freeTrips++;await useTicket(p)}
  else if(k==='pagki')await usePagki(p);
  else if(k==='onsenken')await useOnsenken(p);
  else if(k==='rail')await useRail(p);
  if(state&&!state.over){await checkMilestones(p);endTurn()}
}

$('#btnInfo').onclick=()=>{SFX.click();openInfo()};
$('#btnMenu').onclick=()=>{SFX.click();openMenu()};
$('#btnSound').onclick=()=>{if(S.sound&&S.bgm)S.bgm=false;else if(S.sound)S.sound=false;else{S.sound=true;S.bgm=true}saveSet();renderHud();if(S.sound)SFX.pop();toast(S.sound&&S.bgm?'🔊 BGMと効果音 ON':S.sound?'🔉 効果音だけ ON（BGM OFF）':'🔇 音 OFF')};
$('#btnMap').onclick=()=>{
  const b=$('#board');b.classList.toggle('zoom');
  $('#mapLbl').textContent=b.classList.contains('zoom')?'全体':'ズーム';
  if(state)requestAnimationFrame(()=>focusPos(pieceXY(cur()),false));
};
$('#hudChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){SFX.click();locatePlayer(+c.dataset.pid)}});
$('#raceBar').addEventListener('click',e=>{const c=e.target.closest('.rbP');if(c){SFX.click();locatePlayer(+c.dataset.pid)}});
$('#board').addEventListener('click',e=>{
  const pc=e.target.closest('.piece');if(pc&&state){SFX.click();openInfo(+pc.id.slice(2));return}
  const g=e.target.closest('.sq');if(!g)return;
  if(g.dataset.b!=null&&BRANCH){const t=SQ_TYPES[BRANCH.types[+g.dataset.b]];toast(`⛰️ <b>山道の近道</b>・${t.icon} ${t.name}<br>${t.desc}`);return}
  const i=+g.dataset.i,s=BOARD[i];if(!s)return;
  if(s.major>=0){const sp=SPOTS[s.major];toast(`${sp.emoji} <b>${sp.name}</b><br>${sp.desc}`)}
  else{const t=SQ_TYPES[s.type];toast(`<b>${t.icon} ${t.name}</b><br>${t.desc}`)}
});

$('#musicHint').addEventListener('click',e=>{e.stopPropagation();unlockAudio();setTimeout(renderMusicHint,300)});
buildBoard();buildBranch();$('#ciPug').innerHTML=pugSVG('gray','proud',40);renderTitleArt();renderTitle();
})();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
